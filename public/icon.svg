<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    SFB app icon — hairline-only outline, transparent inside.
    The PNG (icon-512.png) carries the actual engraving raster; this SVG
    is a vector fallback / browser favicon, sized down to taste.
  -->
  <rect x="3" y="3" width="506" height="506" rx="56" fill="none" stroke="#171717" stroke-width="4"/>

  <!-- Stylized shuttle silhouette in ink (matches the framing's character) -->
  <g transform="translate(256 268) rotate(-8)">
    <path d="M -90 -150 L -28 78 L 28 78 L 90 -150 Z" fill="#171717"/>
    <path d="M -36 56 Q -36 104 0 108 Q 36 104 36 56 Z" fill="#171717"/>
    <g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none">
      <line x1="-54" y1="-116" x2="-22" y2="48"/>
      <line x1="0" y1="-148" x2="0" y2="64"/>
      <line x1="54" y1="-116" x2="22" y2="48"/>
    </g>
  </g>
</svg>
