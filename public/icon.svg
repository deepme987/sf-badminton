<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SF-Badminton app icon. Emerald base + white shuttle. -->
  <rect width="512" height="512" rx="112" fill="#059669"/>
  <g transform="translate(256 272)">
    <!-- Feather skirt: triangular flare opening up -->
    <path d="M -88 -148 L -28 76 L 28 76 L 88 -148 Z" fill="#FFFFFF"/>
    <!-- Cork base: rounded bottom -->
    <path d="M -36 56 Q -36 104 0 108 Q 36 104 36 56 Z" fill="#FFFFFF"/>
    <!-- Feather creases: emerald lines from cork to top -->
    <g stroke="#059669" stroke-width="9" stroke-linecap="round" fill="none">
      <line x1="-52" y1="-116" x2="-20" y2="44"/>
      <line x1="0" y1="-148" x2="0" y2="64"/>
      <line x1="52" y1="-116" x2="20" y2="44"/>
    </g>
  </g>
</svg>
