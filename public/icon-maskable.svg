<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Maskable variant for Android adaptive icons. Safe zone is the centered
    circle (radius ~205px) — Android crops to various shapes. We fill the
    whole canvas with cream so the mask never reveals page background, and
    keep the shuttle well inside the safe zone.
  -->
  <rect width="512" height="512" fill="#FAFAFA"/>
  <g transform="translate(256 268) rotate(-8) scale(0.72)">
    <path d="M -90 -150 L -28 78 L 28 78 L 90 -150 Z" fill="#171717"/>
    <path d="M -36 56 Q -36 104 0 108 Q 36 104 36 56 Z" fill="#171717"/>
    <g stroke="#FAFAFA" stroke-width="5" stroke-linecap="round" fill="none">
      <line x1="-54" y1="-116" x2="-22" y2="48"/>
      <line x1="0" y1="-148" x2="0" y2="64"/>
      <line x1="54" y1="-116" x2="22" y2="48"/>
    </g>
  </g>
</svg>
