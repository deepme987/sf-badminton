name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Opt actions/checkout@v4 + actions/setup-node@v4 (which ship as Node.js 20
# binaries internally) onto the Node.js 24 runtime. GitHub forces this
# default on June 2nd, 2026; setting the flag now silences the deprecation
# warning and verifies we work on Node 24 ahead of the cutover. Drop this
# block once we move to v5 of those actions (not yet released as of writing).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    name: typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # ⚠️ Vitest is INTENTIONALLY not run in CI.
      #
      # The unit suite resets `sessions` via `db.delete(sessions)` in
      # beforeEach (see tests/_helpers.ts). When two CI runs hit the same
      # Supabase project (e.g. concurrent PRs, or two pushes in quick
      # succession), one run wipes the other's fixtures mid-test → flake.
      # More importantly, the same destructive reset would wipe production
      # sessions if DATABASE_URL points anywhere live.
      #
      # Vitest must be run LOCALLY against the developer's own dev DB. See
      # CONTRIBUTING.md → "Tests".
      #
      # To re-enable safely we'd need a dedicated test Supabase project
      # (free tier is fine) wired as a separate secret; only that
      # connection string should appear in this workflow.

      # The Next production build catches issues that typecheck doesn't —
      # missing imports, route conflicts, dynamic-render bugs. Cheap on CI.
      - name: Build
        env:
          # Build needs SOMETHING for the public Supabase URL to satisfy the
          # zod env validation; pass a non-secret placeholder here. Real
          # values get injected by Vercel at deploy time.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
        run: npm run build
