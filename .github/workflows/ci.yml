name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Vitest hits the real Supabase via DATABASE_URL — the suite resets
      # tables in beforeEach so PR runs don't pollute prod data, but they
      # DO share the project. If a contributor opens many simultaneous PRs,
      # the runs serialize on the DB lock; that's fine for our throughput.
      - name: Vitest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm test

      # The Next production build catches issues that typecheck doesn't —
      # missing imports, route conflicts, dynamic-render bugs. Cheap on CI.
      - name: Build
        env:
          # Build needs SOMETHING for the public Supabase URL to satisfy the
          # zod env validation; pass a non-secret placeholder here. Real
          # values get injected by Vercel at deploy time.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
        run: npm run build
